name: Pages

on:
  push:
    branches: [main]
  # A newly published sparewall release reaches the docs within six hours
  # (or at once, with a manual run): its own workflows cannot start this one
  # without a token for this repository.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The docs are those of the latest published release: not main, and
      # not a draft or a prerelease.
      - name: The latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/sparewall/sparewall/releases/latest -q .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "docs: sparewall $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sparewall/sparewall
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          persist-credentials: false
      - name: Install MkDocs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r requirements-docs.txt
      - name: Assemble site
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir _site
          cp -r index.html 404.html assets _site/
          PATH=$PWD/.venv/bin:$PATH ./build-docs.sh upstream "$TAG" _site/docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
