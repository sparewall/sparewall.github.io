name: Pages

on:
  push:
    branches: [main]
  # Pull requests build the site, docs included, without deploying it.
  pull_request:
  # A newly published sparewall release reaches the docs within six hours
  # (or at once, with a manual run): its own workflows cannot start this one
  # without a token for this repository.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      # The docs are those of the latest published release: not main, and
      # not a draft. A prerelease published after it is built as well, into
      # docs/next/.
      - name: The latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/sparewall/sparewall/releases/latest)
          tag=$(jq -r .tag_name <<<"$latest")
          # The newest prerelease published after the latest release.
          next=$(gh api --paginate repos/sparewall/sparewall/releases |
            jq -rs --arg after "$(jq -r .published_at <<<"$latest")" '
              [.[][] | select(.prerelease and (.draft | not)
                              and .published_at > $after)]
              | sort_by(.published_at) | last | .tag_name // empty')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "docs: sparewall $tag${next:+, and $next in docs/next/}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sparewall/sparewall
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.next != ''
        with:
          repository: sparewall/sparewall
          ref: ${{ steps.release.outputs.next }}
          path: upstream-next
          persist-credentials: false
      - name: Install MkDocs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r requirements-docs.txt
      - name: Assemble site
        env:
          TAG: ${{ steps.release.outputs.tag }}
          NEXT: ${{ steps.release.outputs.next }}
        run: |
          mkdir _site
          cp -r index.html 404.html releases assets _site/
          export PATH=$PWD/.venv/bin:$PATH
          ./build-docs.sh upstream "$TAG" _site/docs
          # After docs/, which MkDocs empties before it builds.
          if [ -n "$NEXT" ]; then
            ./build-docs.sh --preview upstream-next "$NEXT" _site/docs/next
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
